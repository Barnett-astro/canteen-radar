<!doctype html>
<html lang="zh-CN">
<head>

<title>食堂雷达 · 懂你校园节奏的食堂指南</title>
<meta name="description" content="校园食堂点评推荐：按校园场景推荐、实时人流、红黑榜避雷、10秒轻点评、档口故事。">
<style>
:root{
  --bg:#f5f2ec;--card:#ffffff;--ink:#1f1d1a;--ink2:#6b665e;--ink3:#9a948a;--line:#e9e4da;
  --pri:#e5602a;--pri-soft:#fdede4;--good:#1d9a60;--good-soft:#e3f4eb;--bad:#d24343;--bad-soft:#fbe8e8;
  --warn:#c98a10;--warn-soft:#fbf1d9;--blue:#3868d0;--blue-soft:#e8eefb;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(60,40,20,.06);
  --frame:#e9e4db;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141311;--card:#1f1d1a;--ink:#f2eee7;--ink2:#aaa398;--ink3:#7a746b;--line:#302d28;
  --pri:#f27b46;--pri-soft:#3a2317;--good:#43c187;--good-soft:#15302a;--bad:#ef6b6b;--bad-soft:#3a1d1d;
  --warn:#e6b24a;--warn-soft:#342a14;--blue:#7aa2f2;--blue-soft:#1b2640;--shadow:none;--frame:#0d0c0b;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--frame);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px;position:relative}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.logo i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--pri);color:#fff;font-size:15px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.g{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.b{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.p{background:var(--pri-soft);border-color:transparent;color:var(--pri)}
.chip.bl{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.wrap{padding:0 16px}
.notice{margin:4px 16px 12px;padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.notice b{font-weight:600}
.h2{font-size:17px;font-weight:700;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.h2 small{font-size:12px;font-weight:400;color:var(--ink3)}
.h2 .sp+a,.h2 button.more{font-size:12.5px;color:var(--ink2);font-weight:400}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:14px}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.hello{padding:4px 16px 0}
.hello h1{font-size:22px;margin:0 0 2px;font-weight:800}
.hello p{margin:0;color:var(--ink2);font-size:13.5px}
.exam{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;align-items:center;gap:8px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scene{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:left;transition:.15s}
.scene .i{font-size:20px}
.scene .n{font-weight:700;font-size:14px;margin-top:2px}
.scene .d{font-size:11px;color:var(--ink3);line-height:1.35;margin-top:1px}
.scene.on{border-color:var(--pri);background:var(--pri-soft)}
.scene.on .d{color:var(--pri)}
.need{margin-top:10px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec{display:flex;gap:12px;padding:12px;align-items:flex-start}
.rec+.rec{border-top:1px solid var(--line)}
.rank{width:26px;height:26px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rec .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec .s{font-size:12.5px;color:var(--ink2);margin-top:1px}
.rec .rs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.price{margin-left:auto;text-align:right;flex:none}
.price b{font-size:16px;color:var(--pri)}
.star{color:#f0a020;font-weight:700}
.bars .row{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin:8px 0}
.bars .lab{font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.g>i{background:var(--good)}.bar.b>i{background:var(--bad)}.bar.bl>i{background:var(--blue)}
.pct{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;padding:12px;text-align:left}
.mini .t{font-weight:700;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--pri);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.random{display:flex;align-items:center;gap:12px;padding:14px;margin-top:12px}
.random .big{font-size:28px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink3);gap:1px}
.nav button .i{font-size:20px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--pri);font-weight:600}
.nav button.on .i{filter:none;opacity:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.canteen{padding:14px;margin-bottom:12px}
.canteen .hd{display:flex;align-items:center;gap:10px}
.canteen .nm{font-size:17px;font-weight:800}
.meter{display:flex;gap:3px;margin-top:10px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.win{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);text-align:left;width:100%}
.win .wn{font-weight:600}
.dish{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dish:first-child{border-top:0}
.story{background:linear-gradient(135deg,var(--warn-soft),var(--pri-soft));border-radius:14px;padding:14px;margin:12px 0}
.story .q{font-style:italic;color:var(--ink2);margin-top:8px;font-size:13px}
.rv{padding:12px 0;border-top:1px solid var(--line)}
.rv .u{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700;flex:none}
.rv .tx{margin:6px 0 4px;font-size:14px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;border-radius:20px 20px 0 0;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .sh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;z-index:2;border-bottom:1px solid var(--line)}
.sheet .sh b{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sb{padding:6px 16px 28px}
.x{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.stars{display:flex;gap:6px;font-size:30px}
.stars button{color:var(--line);transition:.1s}
.stars button.on{color:#f0a020}
.fl{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--ink2)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick .chip{padding:6px 11px;font-size:13px;cursor:pointer}
textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;resize:none;min-height:70px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.hourchart{display:flex;align-items:flex-end;gap:2px;height:110px;padding-top:6px}
.hourchart i{flex:1;border-radius:3px 3px 0 0;background:var(--pri);opacity:.75;position:relative}
.hourchart i.now{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.hourchart i.off{background:var(--line);opacity:1}
.hx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--card);cursor:pointer}
.tbl{max-height:360px;overflow:auto;border-radius:12px}
pre{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto;max-height:300px}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:8px 0}
.mem{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;font-size:13.5px}
.mem .m{font-size:11.5px;color:var(--ink3);margin-top:3px}
.rip{padding:12px;border-radius:14px;background:var(--card);border:1px dashed var(--ink3);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.empty{padding:22px;text-align:center;color:var(--ink3);font-size:13px}
.slot{font-size:22px;font-weight:800;min-height:34px}
.prd h3{font-size:15px;margin:16px 0 6px}
.prd p,.prd li{font-size:13.5px;color:var(--ink2);margin:4px 0}
.prd ul{padding-left:18px;margin:4px 0}
.timesel{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 6px;color:var(--ink2)}
.fav{font-size:20px}
input[type=range]{width:100%;accent-color:var(--pri)}
.row2{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

    <div class="logo"><i>雷</i>食堂雷达</div>

<script>

function allReviews(){return SEED_REVIEWS.map((r,i)=>({...r,id:'s'+i})).concat(S.reviews.map(r=>({...r,mine:true})));}
function stat(d){const mine=S.reviews.filter(r=>r.d===d.id);const n=d.cnt+mine.length;const r=(d.r*d.cnt+mine.reduce((a,b)=>a+b.st,0))/n;return{r,n};}
function isOpen(c,h=nowH()){return h>=c.o&&h<c.c;}
function crowd(cid,h=nowH()){const c=C(cid);if(!isOpen(c,h))return -1;let v=8;c.peaks.forEach(([mu,a,s])=>v+=a*Math.exp(-((h-mu)**2)/(2*s*s)));
 if(S.exam&&cid==='c2')v+=15; if(S.exam&&cid==='c4'&&h>21)v+=10; return Math.max(5,Math.min(100,Math.round(v)));}
function crowdTag(cid,h){const v=crowd(cid,h);if(v<0)return'<span class="chip">未营业</span>';const q=Math.round(v/100*15);
 if(v<35)return`<span class="chip g">空闲 · 排队约${q}分钟</span>`;if(v<70)return`<span class="chip w">适中 · 排队约${q}分钟</span>`;return`<span class="chip b">拥挤 · 排队约${q}分钟</span>`;}
function blocked(d){return d.avoid.some(a=>S.avoid.includes(a))||d.p>S.budget;}
function score(d,k){
 const w=W(d.w),c=C(w.c),st=stat(d);
 if(!d.sc[k])return null;
 if(k==='early'&&c.o>7.5)return null;
 if(k==='due'&&c.c<21.5)return null;
 if(k==='pre'&&(d.smell||d.fl==='重口'))return null;
 if(blocked(d))return null;
 let s=d.sc[k]*1.3+(st.r-3.8)*2.2+Math.log10(st.n)*.4+d.rep/100;
 if(k==='pre'){if(d.spd>6)s-=1;if(d.fl==='清淡')s+=.6;}
 if(k==='early'&&d.portable)s+=.5;
 if(k==='group'&&d.share)s+=.6;
 const cr=crowd(c.id);if(cr<0)s-=1.2;else if(cr>75)s-=.4;
 if(S.exam&&(k==='pre'||k==='after'||k==='due'))s+=.2;
 const mine=S.reviews.filter(r=>r.d===d.id&&r.s===k);s+=mine.reduce((a,b)=>a+(b.st-3)*.3,0);
 return s;}
function reasons(d,k){const w=W(d.w),c=C(w.c),st=stat(d),r=[];
 if(k==='early'){r.push(`${fmtH(c.o)} 开门`);if(d.portable)r.push('可边走边吃');}
 if(k==='pre'){if(d.fl==='清淡')r.push('清淡无异味');r.push(`出餐约${d.spd}分钟`);}
 if(k==='due')r.push(`营业到 ${fmtH(c.c)}`);
 if(k==='group'&&d.share)r.push('适合分享');
 if(k==='after'&&st.r>=4.5)r.push('高分犒劳');
 if(d.spd<=3&&k!=='pre')r.push(`出餐约${d.spd}分钟`);
 if(d.rep>=80)r.push(`回购率 ${d.rep}%`);
 if(d.isNew)r.push('本周新菜');
 return r.slice(0,3);}
function recommend(k,n=5){return DISHES.map(d=>({d,s:score(d,k)})).filter(x=>x.s!=null).sort((a,b)=>b.s-a.s).slice(0,n);}
function sceneShare(k){
 const items=DISHES.filter(d=>d.sc[k]>0&&!(k==='early'&&C(W(d.w).c).o>7.5)&&!(k==='due'&&C(W(d.w).c).c<21.5)).map(d=>{
  const st=stat(d);const u=S.reviews.filter(r=>r.d===d.id&&r.s===k).length;
  return{d,w:d.sc[k]**2*st.n*(st.r/5)**6+u*400};});
 const tot=items.reduce((a,b)=>a+b.w,0);items.sort((a,b)=>b.w-a.w);
 const top=items.slice(0,4).map(x=>({d:x.d,p:Math.round(x.w/tot*100)}));
 const rest=100-top.reduce((a,b)=>a+b.p,0);
 return{top,rest,sample:SAMPLE[k]+S.reviews.filter(r=>r.s===k).length};}

function viewData(){
 const revs=allReviews();const totalN=DISHES.reduce((a,d)=>a+stat(d).n,0);
 const sampleTot=SK.reduce((a,k)=>a+sceneShare(k).sample,0);
 const tagCount={};DISHES.forEach(d=>{d.good.forEach(t=>{tagCount[t]=tagCount[t]||{g:1,n:0};tagCount[t].n+=Math.round(d.cnt*.3);});d.bad.forEach(t=>{tagCount[t]=tagCount[t]||{g:0,n:0};tagCount[t].n+=Math.round(d.cnt*.35)});});
 S.reviews.forEach(r=>r.tags.forEach(t=>{tagCount[t]=tagCount[t]||{g:1,n:0};tagCount[t].n++;}));
 const tags=Object.entries(tagCount).sort((a,b)=>b[1].n-a[1].n);
 const topG=tags.filter(x=>x[1].g).slice(0,6),topB=tags.filter(x=>!x[1].g).slice(0,6);
 const mg=Math.max(...topG.map(x=>x[1].n)),mb=Math.max(...topB.map(x=>x[1].n));
 const hrs=[];for(let h=6;h<24;h+=.5)hrs.push(h);const h0=nowH();

 return`<div class="wrap">
 <div class="h2">数据看板 <span class="chip w">示例数据</span></div>
 <div class="kpis">

 </div>

 <div class="h2">场景 → 去向 <small>各场景下同学们的选择</small></div>
 ${SCENES.map(s=>{const sh=sceneShare(s.k);return`<div class="card pad bars" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${s.i} ${s.n}</span><span class="faint" style="font-weight:400;font-size:12px">${sh.sample} 次打卡</span></div>
  ${sh.top.slice(0,3).map(x=>`<div class="row"><div><div class="lab"><span>${esc(x.d.n)} <span class="faint">· ${C(W(x.d.w).c).n}</span></span></div><div class="bar bl"><i style="width:${x.p}%"></i></div></div><div class="pct">${x.p}%</div></div>`).join('')}</div>`}).join('')}

 <div class="h2">分时段人流 <small>虚线外为未营业</small></div>
 <div class="card pad">
  <div class="seg" style="margin-bottom:10px">${CANTEENS.map(c=>`<button class="${crowdC===c.id?'on':''}" onclick="crowdC='${c.id}';render()">${c.n}</button>`).join('')}</div>
  <div class="hourchart">${hrs.map(h=>{const v=crowd(crowdC,h);const isNow=h0>=h&&h0<h+.5;return`<i class="${v<0?'off':''} ${isNow?'now':''}" style="height:${v<0?4:v}%" title="${fmtH(h)} ${v<0?'未营业':v+'%'}"></i>`}).join('')}</div>
  <div class="hx"><span>06:00</span><span>09:00</span><span>12:00</span><span>15:00</span><span>18:00</span><span>21:00</span><span>24:00</span></div>
  <div class="faint" style="font-size:12px;margin-top:8px">当前 ${fmtH(h0)}：${crowdTag(crowdC)} · 建议错峰：${bestTime(crowdC)}</div>
 </div>

 <div class="h2">高频标签</div>
 <div class="card pad bars">
  <div style="font-weight:700;font-size:13px;color:var(--good)">👍 好评原因</div>
  ${topG.map(([t,v])=>`<div class="row"><div><div class="lab"><span>${t}</span></div><div class="bar g"><i style="width:${v.n/mg*100}%"></i></div></div><div class="pct">${v.n}</div></div>`).join('')}
  <div style="font-weight:700;font-size:13px;color:var(--bad);margin-top:14px">👎 差评原因</div>
  ${topB.map(([t,v])=>`<div class="row"><div><div class="lab"><span>${t}</span></div><div class="bar b"><i style="width:${v.n/mb*100}%"></i></div></div><div class="pct">${v.n}</div></div>`).join('')}
 </div>

 <div class="h2">菜品原始数据 <small>点表头排序</small></div>
 <div class="card tbl"><table><thead><tr>
  ${[['n','菜品'],['c','食堂'],['p','价格'],['r','评分'],['cnt','评价数'],['rep','回购%'],['spd','出餐'],['fl','口味']].map(([k,l])=>`<th onclick="sortBy('${k}')">${l}${sortKey===k?(sortDir>0?' ↑':' ↓'):''}</th>`).join('')}
 </tr></thead><tbody>${sorted.map(d=>{const st=stat(d);return`<tr onclick="openDish('${d.id}')" style="cursor:pointer"><td>${esc(d.n)}${d.isNew?' 🆕':''}</td><td>${C(W(d.w).c).n}</td><td>¥${d.p}</td><td style="color:${st.r<3.6?'var(--bad)':st.r>=4.5?'var(--good)':'inherit'};font-weight:600">${st.r.toFixed(2)}</td><td>${st.n}</td><td>${d.rep}</td><td>${d.spd}′</td><td>${d.fl}</td></tr>`}).join('')}</tbody></table></div>
 <details><summary>查看完整数据（JSON）</summary><pre>${esc(JSON.stringify({canteens:CANTEENS,windows:WINDOWS,dishes:DISHES,reviews:revs,closedWindows:RIP},null,1))}</pre></details>
 <button class="btn ghost block" onclick="downloadData()">⬇️ 下载数据 JSON</button>
 </div>`;}
function sortVal(d){if(sortKey==='c')return W(d.w).c;if(sortKey==='r')return stat(d).r;if(sortKey==='cnt')return stat(d).n;return d[sortKey];}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}render();}
function bestTime(cid){const c=C(cid);let best=null;for(let h=Math.max(c.o,nowH());h<c.c;h+=.25){const v=crowd(cid,h);if(v>=0&&v<35){best=h;break;}}return best==null?'今天剩余时段都偏挤':fmtH(best)+' 以后较空';}
function downloadData(){const b=new Blob([JSON.stringify({canteens:CANTEENS,windows:WINDOWS,dishes:DISHES,reviews:allReviews(),closedWindows:RIP},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shitang-leida-data.json';a.click();}

/* ================= 弹层 ================= */
let stack=[];
function openSheet(fn){stack.push(fn);renderSheet();}
function back(){stack.pop();renderSheet();}
function closeAll(){stack=[];renderSheet();}
function renderSheet(){const ov=$('#ov');if(!stack.length){ov.classList.remove('show');document.body.style.overflow='';return;}
 const {title,body}=stack[stack.length-1]();
 $('#sheet').innerHTML=`<div class="sh">${stack.length>1?'<button class="x" onclick="back()">‹</button>':''}<b>${title}</b><button class="x" onclick="closeAll()">✕</button></div><div class="sb">${body}</div>`;
 ov.classList.add('show');document.body.style.overflow='hidden';}
function refreshSheet(){if(stack.length)renderSheet();}

 <div class="fl">点评（${revs.length}）</div>${revs.length?revs.map(rvHTML).join(''):'<div class="empty">还没有文字点评，来当第一个吧</div>'}
 <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" onclick="openWin('${w.id}')">看窗口</button><button class="btn" style="flex:2" onclick="openReview('${id}')">✍️ 10 秒点评</button></div>`};});}
function toggleFav(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];save();refreshSheet();toast(S.favs.includes(id)?'已收藏':'已取消收藏');}

const GOOD_T=['好吃','份量足','性价比高','出餐快','清淡','热乎','适合分享','会回购'];
const BAD_T=['踩雷','太咸','太油','份量少','排队久','偏贵','凉了','有异味'];
let R={};
function openReview(id){R={d:id,st:0,tags:[],s:scene||defaultScene(),t:''};openSheet(reviewSheet);}
function reviewSheet(){const d=Dd(R.d);return{title:'10 秒点评',body:`
 <div class="fl" style="margin-top:8px">吃的是</div>
 <select onchange="R.d=this.value" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)">${DISHES.map(x=>`<option value="${x.id}" ${x.id===R.d?'selected':''}>${esc(x.n)} · ${C(W(x.w).c).n}</option>`).join('')}</select>
 <div class="fl">打个分</div><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=R.st?'on':''}" onclick="R.st=${i};refreshSheet()">★</button>`).join('')}<span class="faint" style="font-size:13px;align-self:center">${['','踩雷了','不太行','一般','不错','必吃！'][R.st]}</span></div>
 <div class="fl">什么场景吃的？<span class="faint" style="font-weight:400">（帮下一位同学做决定）</span></div>
 <div class="pick">${SCENES.map(s=>`<span class="chip ${R.s===s.k?'on':''}" onclick="R.s='${s.k}';refreshSheet()">${s.i} ${s.n}</span>`).join('')}</div>
 <div class="fl">一键标签</div>
 <div class="pick">${GOOD_T.map(t=>`<span class="chip ${R.tags.includes(t)?'on':'g'}" onclick="togTag('${t}')">${t}</span>`).join('')}</div>
 <div class="pick" style="margin-top:6px">${BAD_T.map(t=>`<span class="chip ${R.tags.includes(t)?'on':'b'}" onclick="togTag('${t}')">${t}</span>`).join('')}</div>
 <div class="fl">说两句（可选）</div><textarea maxlength="140" placeholder="比如：pre 前吃的，完全不犯困" oninput="R.t=this.value">${esc(R.t)}</textarea>
 <button class="btn block" style="margin-top:14px" onclick="submitReview()">提交</button>`};}
function togTag(t){R.tags=R.tags.includes(t)?R.tags.filter(x=>x!==t):[...R.tags,t];refreshSheet();}
function submitReview(){if(!R.st)return toast('先打个分吧');
 const first=!S.reviews.length;const ts=Date.now();
 S.reviews.push({d:R.d,st:R.st,tags:R.tags,s:R.s,t:R.t.trim(),u:'我',ago:'刚刚',ts,up:0,id:'u'+ts});save();
 stack.pop();render();refreshSheet();
 toast(`已提交！已计入「${SCENES.find(s=>s.k===R.s).n}」场景数据${first?' · 获得 🏅 尝鲜官':''}`);}

function openPRD(){openSheet(()=>({title:'产品需求文档（简版）',body:`<div class="prd">
 <p><b>一句话理念：吃饭是校园生活的映射。</b></p>
 <h3>1. 背景与洞察</h3><ul>
 <li>学生去食堂多是被<b>时间、预算、距离</b>约束，问题不是“吃什么”，而是“去哪个食堂、排哪个窗口、会不会踩雷”。</li>
 <li>食堂几乎没有信息，新菜、换档口、口碑变差只能口口相传；打了饭不能退，<b>踩雷成本高</b>。</li>
 <li>选择由<b>校园场景</b>决定：pre 前要清淡要快，早八要开门早，考试后想犒劳自己。外卖平台不知道这些上下文，这是校园产品的护城河。</li>
 <li>吃食堂也有情感属性：档口的历史、共同的记忆。</li></ul>
 <h3>2. 目标用户</h3><ul><li>核心：日常吃食堂、时间紧、预算敏感的在校生</li><li>次要：信息最缺的新生；有忌口或健身需求的同学</li></ul>
 <h3>3. 定位</h3><p>懂你校园节奏的食堂指南：场景化推荐，加上信息透明和避雷。</p>
 <h3>4. 功能结构</h3><ul>
 <li><b>场景推荐</b>：6 个场景 → 推荐 + 同场景群体数据；随机帮选；考试周模式</li>
 <li><b>信息透明</b>：食堂、窗口、今日菜单、营业时间、实时人流与排队时长</li>
 <li><b>避雷与口碑</b>：红榜（贝叶斯平均防刷）、避雷榜（附差评原因）、新菜速递</li>
 <li><b>轻点评</b>：星级 + 一键标签 + 场景标签，10 秒完成；数据回流到推荐</li>
 <li><b>情怀</b>：档口故事、食堂记忆墙、已关闭窗口纪念墙</li>
 <li><b>个人</b>：忌口、预算、收藏、我的点评</li></ul>
 <h3>5. 核心闭环</h3><p>选场景 → 看推荐和群体数据 → 查窗口（菜单、人流、口碑）→ 吃完 10 秒点评（带场景标签）→ 数据回流到推荐和榜单。</p>
 <h3>6. 关键风险</h3><ul>
 <li><b>UGC 供给</b>：点评极轻量 + 尝鲜官激励；让食堂方上传菜单、回应差评</li>
 <li><b>冷启动</b>：档口故事等长期内容填充页面；数据不足时退回按评分推荐</li>
 <li><b>隐私</b>：不用饭卡消费数据，只用用户主动点评和打卡的数据</li>
 <li><b>刷分与恶意差评</b>：贝叶斯平均、校园身份认证、异常检测</li></ul>
 <h3>7. 后续迭代</h3><ul><li>接入真实校历与课表，自动识别“下节课在哪栋楼”推荐最近食堂</li><li>食堂方后台：上传菜单、查看差评、回复</li><li>约饭搭子、毕业季“最怀念的窗口”投票</li></ul>
 </div>`}));}

const TABS=[['home','🏠','推荐'],['canteens','🍱','食堂'],['rank','🏆','榜单'],['data','📊','数据'],['me','👤','我的']];
function render(){
 $('#nav').innerHTML=TABS.map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="i">${i}</span>${n}</button>`).join('');
 $('#view').innerHTML={home:viewHome,canteens:viewCanteens,rank:viewRank,data:viewData,me:viewMe}[tab]();}
function go(k){tab=k;render();window.scrollTo(0,0);}
render();
</script>
</body>
